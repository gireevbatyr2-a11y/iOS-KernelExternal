name: Build

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@main

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Install Theos
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar

      - name: Build library
        run: |
          export THEOS="$(pwd)/theos"
          make FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Install library into Theos
        run: |
          export THEOS="$(pwd)/theos"
          mkdir -p $THEOS/lib/iphone/rootless
          cp -v .theos/obj/kernelexternal.dylib $THEOS/lib/iphone/rootless/libkernelexternal.dylib
          cp -v .theos/obj/kernelexternal.a $THEOS/lib/iphone/rootless/libkernelexternal.a || true

      - name: Build External.app
        run: |
          export THEOS="$(pwd)/theos"
          make -C app FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Package .tipa
        run: |
          rm -rf Payload External.tipa
          cp -r .theos/obj/External.app Payload/External.app
          zip -qr External.tipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: External.tipa
          path: External.tipa
